// Real elevation, exaggerated. HILLS/RIDGES above were hand-placed, so the stretch
// came out 4.8x-9.9x depending where you stood — Big Buddha's hill (really 400m) ended
// up TALLER than Khao Mai Thao Sip Song (really 529m, the island's actual high point).
// Now every sample goes through one formula, so relative topography is real and EXAG is
// the single art knob. Phuket IS flat (max 537m ≈ 4.6u at 1:1); EXAG keeps it Zelda.
const EXAG=6.5;

  const i=Math.min(DEM_N-2,Math.floor(u)), j=Math.min(DEM_N-2,Math.floor(v));
  const fu=u-i, fv=v-j, g=(a,b)=>RAW_DEM[b*DEM_N+a];

  // DEM's 0m coastal cells can't cut a cliff at the waterline.
  let h = Math.min(d,8)/8*2.5;

  // omits; `mask` is derived from distance INSIDE the outline, so terrain can only rise
  // on Phuket itself — foreign land is masked to zero automatically.
  h += demMetres(x,z)/117*EXAG*mask;

function buildShark(){
  const g=new THREE.Group();

  // TORSO: lathe profile along local +z (nose forward), fat mid-front tapering to thin tail base
  const prof=[
    new THREE.Vector2(0.02,-1.30),
    new THREE.Vector2(0.28,-1.18),
    new THREE.Vector2(0.50,-0.95),
    new THREE.Vector2(0.60,-0.60),
    new THREE.Vector2(0.63,-0.15),
    new THREE.Vector2(0.61, 0.25),
    new THREE.Vector2(0.52, 0.60),
    new THREE.Vector2(0.38, 0.90),
    new THREE.Vector2(0.22, 1.10),
    new THREE.Vector2(0.09, 1.24),
    new THREE.Vector2(0.03, 1.30),
  ];
  const bodyGeo=new THREE.LatheGeometry(prof,20);
  bodyGeo.rotateX(Math.PI/2); // lathe axis (was local Y) -> local Z, nose at +z
  const body=new THREE.Mesh(bodyGeo,toon(STEEL));
  body.scale.set(1,0.88,1);
  g.add(addOutline(body));

  // PALE BELLY: flattened scaled duplicate, shifted down, clipped visually by being thin & under
  const bellyGeo=bodyGeo.clone();
  const belly=new THREE.Mesh(bellyGeo,toon(CREAM));
  belly.scale.set(0.86,0.42,0.97);
  belly.position.y=-0.28;
  g.add(belly);

  // HEAD BUMP: chunky rounded snout cap, slightly flattened, in front of lathe nose
  const snout=new THREE.Mesh(new THREE.SphereGeometry(0.44,16,12),toon(STEEL));
  snout.scale.set(1,0.82,0.7);
  snout.position.set(0,0.05,1.18);
  g.add(addOutline(snout));

  // EYES: big round white + dark pupil, sit on upper sides of head
  [-1,1].forEach(s=>{
    const eyeW=new THREE.Mesh(new THREE.SphereGeometry(0.19,12,10),new THREE.MeshBasicMaterial({color:WHITE}));
    eyeW.position.set(s*0.38,0.28,1.18);

    pupil.position.set(s*0.38,0.28,1.30);
    g.add(pupil);
  });

  // GRIN: torus arc smile under the snout, opening downward-forward
  const smileGeo=new THREE.TorusGeometry(0.36,0.05,8,16,Math.PI*0.85);
  const smile=new THREE.Mesh(smileGeo,new THREE.MeshBasicMaterial({color:DARK}));
  smile.position.set(0,-0.14,1.31);
  smile.rotation.set(Math.PI*0.06,0,Math.PI*1.075);
  g.add(smile);

  // TEETH: tiny white triangle cones along the smile arc
  const teethCount=6;
  for(let i=0;i<teethCount;i++){

    const ang=Math.PI*(0.08+0.84*t);
    const tx=Math.cos(ang)*0.36, ty=-Math.sin(ang)*0.36;
    const tooth=new THREE.Mesh(new THREE.ConeGeometry(0.035,0.09,6),new THREE.MeshBasicMaterial({color:WHITE}));

  // DORSAL FIN: tall flattened scaled cone, curved back via slight rotation
  const dorsal=new THREE.Mesh(new THREE.ConeGeometry(0.42,0.95,4),toon(STEEL_DK));
  dorsal.scale.set(0.42,1,1);
  dorsal.position.set(0,0.78,0.05);
  dorsal.rotation.z=Math.PI;
  dorsal.rotation.y=Math.PI/4;
  dorsal.rotation.x=-0.28;
  g.add(addOutline(dorsal,1.08));

  [-1,1].forEach(s=>{

    pec.rotation.z=s*1.05;

const heightTex=new THREE.DataTexture(heightData,HM_W,HM_H,THREE.RedFormat,THREE.FloatType);

const oceanUniforms={
  uTime:{value:0}, uHeight:{value:heightTex},
  uHm:{value:new THREE.Vector4(HM_X0,HM_Z0,HM_SX,HM_SZ)},
  ...THREE.UniformsLib.fog
};
const ocean=new THREE.Mesh(
  new THREE.PlaneGeometry(2000,2000,140,140).rotateX(-Math.PI/2),
  new THREE.ShaderMaterial({
    uniforms:oceanUniforms, fog:true, transparent:false,
    vertexShader:`
      uniform float uTime; varying vec3 vW;
      #include <fog_pars_vertex>
      void main(){
        vec3 p=position;
        p.y += sin(p.x*0.08+uTime)*0.25 + sin(p.z*0.06+uTime*1.3)*0.25; // = waveY (world.js): менять синхронно
        vec4 mvPosition = modelViewMatrix*vec4(p,1.0);
        vW=(modelMatrix*vec4(p,1.0)).xyz;
        gl_Position = projectionMatrix*mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader:`
      uniform float uTime; uniform sampler2D uHeight; uniform vec4 uHm;
      varying vec3 vW;
      #include <fog_pars_fragment>
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float noise(vec2 p){
        vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
        return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
      }
      void main(){
        vec2 uv=(vW.xz-uHm.xy)/uHm.zw;
        float h = (uv.x>0.0&&uv.x<1.0&&uv.y>0.0&&uv.y<1.0) ? texture2D(uHeight,uv).r : -6.0;
        // deep vs shallow — Wind Waker light blue
        vec3 deep=vec3(0.16,0.47,0.72), shallow=vec3(0.35,0.75,0.80);
        vec3 col=mix(deep,shallow,smoothstep(-6.0,-0.5,h));
        // drifting contour swirls
        float n=noise(vW.xz*0.045+vec2(uTime*0.04,uTime*0.025))
               +0.5*noise(vW.xz*0.11-vec2(uTime*0.03,0.0));
        float band=smoothstep(0.86,0.90,n)-smoothstep(0.96,1.0,n);
        col=mix(col,vec3(0.92,0.98,1.0),band*0.9);
        // animated shoreline foam
        float shore=smoothstep(-2.2,-0.1,h)*(1.0-smoothstep(0.0,0.4,h));
        float pulse=0.5+0.5*sin(uTime*1.8 - h*4.0 + noise(vW.xz*0.3)*3.0);
        col=mix(col,vec3(1.0),clamp(shore*(0.45+0.55*pulse),0.0,1.0));
        gl_FragColor=vec4(col,1.0);
        #include <fog_fragment>
      }`
  })
);

// ============================== AUDIO ==============================
let actx=null;
function initAudio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); }
function chime(notes,step=0.13){
  if(!actx)return;
  notes.forEach((f,i)=>{
    const o=actx.createOscillator(),g=actx.createGain();
    o.type='triangle'; o.frequency.value=f;
    const t=actx.currentTime+i*step;
    g.gain.setValueAtTime(0.0,t); g.gain.linearRampToValueAtTime(0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.6);
  });
}

// =============================== LOOP ==============================
const clock=new THREE.Clock();
let t=0, mmTimer=0, runT=0;
// intro fly-in
const INTRO_LEN=6, AERIAL=new THREE.Vector3(45,480,180), ISLAND_CENTER=new THREE.Vector3(0,0,0);
let introT=0;
camera.position.copy(AERIAL); camera.lookAt(ISLAND_CENTER);
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05); t+=dt;
  oceanUniforms.uTime.value=t;

  // movement input, camera-relative
  let mx=0,mz=0;
  if(keys.KeyW)mz-=1; if(keys.KeyS)mz+=1; if(keys.KeyA)mx-=1; if(keys.KeyD)mx+=1;

  if(!sailing){
    const moving=mx||mz;
    const shift=keys.ShiftLeft||keys.ShiftRight;
    if(moving&&shift)runT+=dt; else runT=Math.max(0,runT-dt*2);
    const swimming=heightAt(player.position.x,player.position.z)<-0.6&&pierY(player.position.x,player.position.z)===null;
    const speed=(swimming?4.5:10)*(shift&&moving?(runT<4?1.8:1.35):1); // sprint, tires into half-run after 4s
    if(moving){
      const ang=Math.atan2(mx,mz)+camYaw; // W = away from camera
      const nx=player.position.x+Math.sin(ang)*speed*dt, nz=player.position.z+Math.cos(ang)*speed*dt;
      player.position.x=nx; player.position.z=nz; // walk, wade or swim anywhere
      player.rotation.y=ang;
    }
    const pier=pierY(player.position.x,player.position.z);
    const ground=swimming
      ? waveY(player.position.x,player.position.z,t)-0.95
      : Math.max(heightAt(player.position.x,player.position.z),pier!==null?pier:-0.45,-0.45);
    if(keys.Space&&!airborne&&!swimming){vy=9;airborne=true;}
    if(airborne){
      player.position.y+=vy*dt; vy-=26*dt;
      if(player.position.y<=ground){player.position.y=ground;airborne=false;squash=Math.min(1,-vy*0.045);vy=0;} // harder landing = deeper squash
    } else player.position.y=ground;
    // vehicles are entered only with E (see toggleBoat) — no auto-board
    // blob shadow stays on the ground, shrinks with jump height
    const jumpH=player.position.y-ground;
    blob.position.y=ground-player.position.y+0.06;
    blob.scale.setScalar(Math.max(0.55,1-jumpH*0.1));
    blob.visible=!swimming;
    // ---- character animation -------------------------------------------------
    // Secondary motion is what sells a low-poly rig: the head leads, the torso lags
    // and counter-rotates, joints bend mid-swing, and landings compress. All of it
    // rides on `gait` (0..1) so starting/stopping eases instead of snapping.
    gait+=((moving?1:0)-gait)*Math.min(1,dt*9);
    swimBlend+=((swimming?1:0)-swimBlend)*Math.min(1,dt*5);
    const rate=swimming?6:(shift?(runT<4?16:13):11);
    cyc+=dt*rate;                          // own phase accumulator: rate changes don't jump the cycle
    const sw=Math.sin(cyc)*gait, sw2=Math.sin(cyc*2);

    // limbs: swing from the shoulder/hip, with a bend at elbow/knee mid-stride
    const amp=swimming?0.5:0.85;
    armL.rotation.x=sw*amp;  armR.rotation.x=-sw*amp;
    legL.rotation.x=-sw*amp; legR.rotation.x=sw*amp;
    armL.rotation.z=0.06+gait*0.05; armR.rotation.z=-0.06-gait*0.05; // slight outward flare, clears the skirt
    // Knee bends while the leg swings FORWARD (foot lifting to clear the ground) and
    // straightens to plant and push back. legL.rotation.x=-sw*amp, so the leg is forward
    // when sw>0 — bend on max(0,sw), not max(0,-sw). Getting this backwards makes the
    // whole gait read as walking in reverse.
    legL.userData.foot.rotation.x=Math.max(0,sw)*0.5*gait;
    legR.userData.foot.rotation.x=Math.max(0,-sw)*0.5*gait;
    armL.userData.hand.rotation.x=Math.max(0,-sw)*0.4*gait;
    armR.userData.hand.rotation.x=Math.max(0,sw)*0.4*gait;

    // torso: bob twice per stride, lean into the run, counter-twist against the legs
    squash=Math.max(0,squash-dt*4);
    const bob=gait*Math.abs(sw2)*0.07+(1-gait)*Math.sin(t*2)*0.03; // idle breathing when still
    body.position.y=1.12+bob-squash*0.22;                       // must match the constructor's body.position.y
    body.scale.y=0.86*(1-squash*0.25); body.scale.x=1.06*(1+squash*0.16); // squash preserves volume; base 0.86 = constructor scale
    body.rotation.y=-sw*0.16;                                   // hips/shoulders counter-rotate
    body.rotation.x=gait*(shift?0.16:0.07)+squash*0.1;          // lean forward, fold on impact

    // head: trails the turn by a few frames, bobs opposite the torso, dips on landing
    // Heading snaps instantly (ang comes straight from input), so a slow chase leaves the
    // head pointing ~45deg the WRONG way for a beat — reads as "I walk left, he looks right".
    // Catch up fast and hard-clamp the lag to a few degrees: it's a garnish, not a turn.
    let dy=player.rotation.y-headYaw;
    dy=Math.atan2(Math.sin(dy),Math.cos(dy));                   // shortest way round the circle
    headYaw+=dy*Math.min(1,dt*18);
    const MAXLAG=0.14;                                          // ~8deg, the most that still reads as "head leads"
